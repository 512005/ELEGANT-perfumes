<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="darkBg" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#18202c" />
      <stop offset="60%" stop-color="#0c1017" />
      <stop offset="100%" stop-color="#040608" />
    </radialGradient>
    <linearGradient id="silverGleam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f0f3f8" />
      <stop offset="100%" stop-color="#d4dce8" />
    </linearGradient>
    <linearGradient id="roseAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d9b29a" stop-opacity="0" />
      <stop offset="50%" stop-color="#d9b29a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#d9b29a" stop-opacity="0" />
    </linearGradient>
  </defs>
  <!-- Background circle with soft luxury border -->
  <circle cx="200" cy="200" r="196" fill="url(#darkBg)" stroke="#2b3648" stroke-width="2" />
  <circle cx="200" cy="200" r="184" fill="none" stroke="#d9b29a" stroke-width="0.8" stroke-dasharray="3 4" opacity="0.45" />

  <!-- Perfume diamond / emblem top -->
  <polygon points="200,85 210,100 200,115 190,100" fill="#d9b29a" opacity="0.85" />
  <line x1="130" y1="100" x2="182" y2="100" stroke="url(#roseAccent)" stroke-width="1" />
  <line x1="218" y1="100" x2="270" y2="100" stroke="url(#roseAccent)" stroke-width="1" />

  <!-- Main Brand Title -->
  <text x="200" y="215" font-family="'Playfair Display', Didot, 'Cinzel', Georgia, serif" font-size="64" font-weight="600" fill="url(#silverGleam)" text-anchor="middle" letter-spacing="1">Elegant</text>

  <!-- Subtitle -->
  <text x="200" y="258" font-family="'Cairo', 'DM Sans', sans-serif" font-size="12" font-weight="500" fill="#95a4b9" text-anchor="middle" letter-spacing="7">FINE FRAGRANCE</text>

  <!-- Sparkles -->
  <circle cx="120" cy="140" r="1.8" fill="#ffffff" opacity="0.8" />
  <circle cx="280" cy="265" r="1.5" fill="#d9b29a" opacity="0.8" />
  <circle cx="270" cy="145" r="1.2" fill="#ffffff" opacity="0.6" />
</svg>
